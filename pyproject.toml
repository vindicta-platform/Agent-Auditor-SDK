[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-auditor-sdk"
version = "0.1.0"
description = "Quota-aware AI scheduling SDK for the Vindicta Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Brandon Fox", email = "brandon@vindicta.club" }
]
keywords = ["ai", "quota", "scheduling", "gemini", "rate-limiting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "google-generativeai>=0.5.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "behave>=1.2.6",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/vindicta-platform/agent-auditor-sdk"
Documentation = "https://docs.vindicta.club/agent-auditor-sdk"
Repository = "https://github.com/vindicta-platform/agent-auditor-sdk"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
